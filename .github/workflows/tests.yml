name: Tests

on:
  push:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: traceforge_test
          POSTGRES_USER: traceforge
          POSTGRES_PASSWORD: traceforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceforge -d traceforge_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://traceforge:traceforge@127.0.0.1:5432/traceforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install ".[dev]"
      - name: Run backend tests
        working-directory: apps/backend
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test
