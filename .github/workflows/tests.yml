name: Tests

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: traceforge_test
          POSTGRES_USER: traceforge
          POSTGRES_PASSWORD: traceforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceforge -d traceforge_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://traceforge:traceforge@127.0.0.1:5432/traceforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install ".[dev]"
      - name: Run backend tests
        working-directory: apps/backend
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test
      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install demo dependencies
        working-directory: demo
        run: pip install ".[dev]"
      - name: Run demo tests
        working-directory: demo
        run: pytest

  compose-smoke:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.pull_request.base.ref == 'main'
    needs: [backend, web, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build normal stack images
        run: docker compose build
      - name: Verify migrations from zero
        run: bash scripts/ci/migrations-from-zero.sh
      - name: Run clean-stack smoke E2E
        run: bash scripts/ci/compose-smoke.sh
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color
      - name: Clean up Compose
        if: always()
        run: docker compose --profile demo down -v --remove-orphans

  benchmark-smoke:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    needs: compose-smoke
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install benchmark dependencies
        working-directory: bench
        run: pip install .
      - name: Start clean stack
        run: docker compose up --build -d
      - name: Run benchmark tooling smoke
        run: python bench/run_benchmarks.py --profile small --run-id ci-benchmark --trace-count 20 --spans-per-trace 5 --query-iterations 1 --analysis-sample 1
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up Compose
        if: always()
        run: docker compose down -v --remove-orphans
