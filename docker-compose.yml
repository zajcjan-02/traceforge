services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: traceforge
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge -d traceforge"]
      interval: 2s
      timeout: 2s
      retries: 15

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - traceforge-postgres:/var/lib/postgresql/data

  traceforge-backend:
    build: ./apps/backend

    environment:
      DATABASE_URL: postgresql+psycopg://traceforge:traceforge@postgres:5432/traceforge
      TRACE_QUIET_PERIOD_SECONDS: "2"
      TRACE_LIFECYCLE_SWEEP_INTERVAL_SECONDS: "1"
      TRACE_RETENTION_DAYS: "7"
      TRACE_RETENTION_SWEEP_INTERVAL_SECONDS: "3600"
      TRACE_RETENTION_BATCH_SIZE: "200"
      TRACEFORGE_DEBUG_UI: "true"

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 2s
      timeout: 2s
      retries: 15

  traceforge-worker:
    build: ./apps/backend

    command: python -m traceforge.worker

    environment:
      DATABASE_URL: postgresql+psycopg://traceforge:traceforge@postgres:5432/traceforge
      TRACE_ANALYSIS_POLL_SECONDS: "1"
      TRACE_ANALYSIS_LEASE_SECONDS: "30"
      TRACE_ANALYSIS_MAX_ATTEMPTS: "3"
      TRACE_REPEATED_DATABASE_MIN_COUNT: "5"

    depends_on:
      postgres:
        condition: service_healthy
      traceforge-backend:
        condition: service_healthy

  traceforge-web:
    build: ./apps/web

    environment:
      TRACEFORGE_API_URL: http://traceforge-backend:8000

    depends_on:
      traceforge-backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector:0.160.0

    command:
      - --config=/etc/otelcol/config.yaml

    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  demo-gateway:
    profiles: ["demo"]
    build: ./demo
    command: uvicorn traceforge_demo.gateway:app --host 0.0.0.0 --port 8010
    environment:
      DEMO_REPORTS_DIR: /app/reports
      ORDERS_URL: http://demo-orders:8011
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - demo-orders
      - otel-collector
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./demo/reports:/app/reports

  demo-orders:
    profiles: ["demo"]
    build: ./demo
    command: uvicorn traceforge_demo.orders:app --host 0.0.0.0 --port 8011
    environment:
      DEMO_REPORTS_DIR: /app/reports
      INVENTORY_URL: http://demo-inventory:8012
      PAYMENT_URL: http://demo-payment:8013
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - demo-inventory
      - demo-payment
      - otel-collector
    volumes:
      - ./demo/reports:/app/reports

  demo-inventory:
    profiles: ["demo"]
    build: ./demo
    command: uvicorn traceforge_demo.inventory:app --host 0.0.0.0 --port 8012
    environment:
      DEMO_REPORTS_DIR: /app/reports
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - otel-collector
    volumes:
      - ./demo/reports:/app/reports

  demo-payment:
    profiles: ["demo"]
    build: ./demo
    command: uvicorn traceforge_demo.payment:app --host 0.0.0.0 --port 8013
    environment:
      DEMO_REPORTS_DIR: /app/reports
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - otel-collector
    volumes:
      - ./demo/reports:/app/reports

volumes:
  traceforge-postgres:
