services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: traceforge
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge -d traceforge"]
      interval: 2s
      timeout: 2s
      retries: 15

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - traceforge-postgres:/var/lib/postgresql/data

  traceforge-backend:
    build: ./apps/backend

    environment:
      DATABASE_URL: postgresql+psycopg://traceforge:traceforge@postgres:5432/traceforge
      TRACE_QUIET_PERIOD_SECONDS: "2"
      TRACE_LIFECYCLE_SWEEP_INTERVAL_SECONDS: "1"

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

  otel-collector:
    image: otel/opentelemetry-collector:0.160.0

    command:
      - --config=/etc/otelcol/config.yaml

    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  traceforge-postgres:
