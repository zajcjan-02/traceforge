receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

  otlphttp/traceforge:
    endpoint: http://traceforge-backend:8000
    compression: none

service:
  pipelines:
    traces:
      receivers:
        - otlp

      exporters:
        - debug
        - otlphttp/traceforge
